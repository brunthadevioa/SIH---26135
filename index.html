<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚩</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skill Mission | Maharashtra Skilling Analytics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script type="text/javascript">
      // Pre-set translation cookie from user's saved choice
      (function() {
        var lang = localStorage.getItem('mahaskill_lang') || 'en';
        var host = window.location.hostname;
        if (lang === 'en') {
          document.cookie = 'googtrans=/en/en; path=/;';
          if (host) document.cookie = 'googtrans=/en/en; domain=.' + host + '; path=/;';
        } else {
          document.cookie = 'googtrans=/en/' + lang + '; path=/;';
          if (host) document.cookie = 'googtrans=/en/' + lang + '; domain=.' + host + '; path=/;';
        }
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased">
    <div id="root"></div>
    <div id="google_translate_element" style="display:none !important;"></div>
    
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({
          pageLanguage: 'en',
          includedLanguages: 'en,mr,hi',
          autoDisplay: false,
          layout: google.translate.TranslateElement.InlineLayout.SIMPLE
        }, 'google_translate_element');
      }
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
